# TASK-09 3.6 Pod watcher: agent-observe Deployment, replica 1 with leader
# election (coordination Lease agent-observe/pod-watcher). Pod LIST/WATCH RBAC
# for agent-exec is TASK-06 (deploy/gcp/base/rbac/pod-watcher.yaml, #168); this
# file adds only the watcher's own Lease permission.
#
# RENDER NOTE: ${POD_WATCHER_IMAGE} (digest reference listed in
# AGENT_OBSERVE_IMAGES) and ${CLUSTER_UID} (trusted installation cluster UID)
# are install inputs; a missing value must fail rendering.
#
# The spool is a PersistentVolumeClaim so unacknowledged records survive a
# reschedule to another node (#111 review). Recreate keeps one writer.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-watcher
  namespace: agent-observe
  labels: {app.kubernetes.io/name: pod-watcher}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentarium-pod-watcher-lease
  namespace: agent-observe
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [pod-watcher]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentarium-pod-watcher-lease
  namespace: agent-observe
subjects:
  - kind: ServiceAccount
    name: pod-watcher
    namespace: agent-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentarium-pod-watcher-lease
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pod-watcher-spool
  namespace: agent-observe
  labels: {app.kubernetes.io/name: pod-watcher}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentarium-pod-watcher
  namespace: agent-observe
  labels: {app.kubernetes.io/name: pod-watcher}
data:
  config.json: |
    {
      "namespace": "agent-exec",
      "cluster_uid": "${CLUSTER_UID}",
      "directory": "/var/lib/agentarium/pod-watcher/spool",
      "capacity_bytes": 268435456,
      "page_size": 100,
      "collector_origin": "https://audit-writer.agent-observe.svc:8443",
      "health_origin": "https://control-health.agent-observe.svc:8443",
      "identity_origin": "https://workload-identity.agent-control.svc:8443",
      "token_file": "/var/run/agentarium-bootstrap/token",
      "ca_file": "/etc/agentarium-trust/ca.pem",
      "lease_namespace": "agent-observe",
      "lease_name": "pod-watcher"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-watcher
  namespace: agent-observe
  labels: {app.kubernetes.io/name: pod-watcher}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: pod-watcher}
  template:
    metadata:
      labels: {app.kubernetes.io/name: pod-watcher}
    spec:
      serviceAccountName: pod-watcher
      automountServiceAccountToken: true
      schedulerName: default-scheduler
      nodeSelector: {node-restriction.kubernetes.io/agentarium-role: control}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 30
      containers:
        - name: pod-watcher
          image: "${POD_WATCHER_IMAGE}"
          args: ["--config", "/etc/agentarium/pod-watcher/config.json"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: spool, mountPath: /var/lib/agentarium/pod-watcher}
            - {name: config, mountPath: /etc/agentarium/pod-watcher, readOnly: true}
            - {name: trust, mountPath: /etc/agentarium-trust, readOnly: true}
            - {name: bootstrap, mountPath: /var/run/agentarium-bootstrap, readOnly: true}
      volumes:
        - name: spool
          persistentVolumeClaim: {claimName: pod-watcher-spool}
        - name: config
          configMap: {name: agentarium-pod-watcher}
        - name: trust
          configMap: {name: agentarium-trust}
        - name: bootstrap
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 600, audience: agentarium-identity}
