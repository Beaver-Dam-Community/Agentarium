      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE]
        resources: [pods]
  matchConditions:
    - name: snapshot-identity
      expression: object.spec.serviceAccountName == 'discovery-snapshot'
  variables:
    - name: s
      expression: object.spec
  validations:
    - expression: >-
        variables.s.serviceAccountName == 'discovery-snapshot' &&
        has(variables.s.automountServiceAccountToken) && variables.s.automountServiceAccountToken == false
