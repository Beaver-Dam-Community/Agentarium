{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "node-readiness",
        "namespace": "agent-control"
      },
      "automountServiceAccountToken": false
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "node-readiness",
        "namespace": "agent-control"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "node-readiness"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "node-readiness"
            }
          },
          "spec": {
            "serviceAccountName": "node-readiness",
            "automountServiceAccountToken": false,
            "nodeSelector": {
              "node-restriction.kubernetes.io/agentarium-role": "control"
            },
            "schedulerName": "default-scheduler",
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65532,
              "runAsGroup": 65532,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "terminationGracePeriodSeconds": 30,
            "containers": [
              {
                "name": "node-readiness",
                "image": "${NODE_READINESS_IMAGE}",
                "args": [
                  "--control-health-url=https://control-health.agent-observe.svc:8443",
                  "--identity-url=https://workload-identity.agent-control.svc:8443",
                  "--bootstrap-token=/var/run/agentarium-bootstrap/token",
                  "--tls-ca-file=/etc/agentarium-trust/ca.pem"
                ],
                "env": [
                  {
                    "name": "POD_NAME",
                    "valueFrom": {
                      "fieldRef": {
                        "fieldPath": "metadata.name"
                      }
                    }
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "trust",
                    "mountPath": "/etc/agentarium-trust",
                    "readOnly": true
                  },
                  {
                    "name": "bootstrap",
                    "mountPath": "/var/run/agentarium-bootstrap",
                    "readOnly": true
                  },
                  {
                    "name": "api-token",
                    "mountPath": "/var/run/secrets/kubernetes.io/serviceaccount",
                    "readOnly": true
                  }
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "trust",
                "configMap": {
                  "name": "agentarium-trust"
                }
              },
              {
                "name": "bootstrap",
                "projected": {
                  "sources": [
                    {
                      "serviceAccountToken": {
                        "path": "token",
                        "expirationSeconds": 600,
                        "audience": "agentarium-identity"
                      }
                    }
                  ]
                }
              },
              {
                "name": "api-token",
                "projected": {
                  "sources": [
                    {
                      "serviceAccountToken": {
                        "path": "token",
                        "expirationSeconds": 600
                      }
                    },
                    {
                      "configMap": {
                        "name": "kube-root-ca.crt",
                        "items": [
                          {
                            "key": "ca.crt",
                            "path": "ca.crt"
                          }
                        ]
                      }
                    },
                    {
                      "downwardAPI": {
                        "items": [
                          {
                            "path": "namespace",
                            "fieldRef": {
                              "fieldPath": "metadata.namespace"
                            }
                          }
                        ]
                      }
                    }
                  ]
                }
              }
            ],
            "tolerations": [
              {
                "key": "agentarium.io/observe-not-ready",
                "operator": "Equal",
                "value": "true",
                "effect": "NoSchedule"
              }
            ]
          }
        }
      }
    }
  ]
}
