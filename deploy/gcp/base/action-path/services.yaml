                    "readOnly": true
                  },
                  {
                    "name": "bootstrap",
                    "mountPath": "/var/run/agentarium-bootstrap",
                    "readOnly": true
                  },
                  {
                    "name": "bundle-keys",
                    "mountPath": "/etc/agentarium-bundle-keys",
                    "readOnly": true
                  },
                  {
                    "name": "model-profiles",
                    "mountPath": "/etc/agentarium-model-profiles",
                    "readOnly": true
                  },
                  {
                    "name": "epoch",
                    "mountPath": "/var/lib/agentarium/epoch"
                  }
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  }
                },
                "startupProbe": {
                  "tcpSocket": {
                    "port": "https"
                  },
                  "periodSeconds": 2,
                  "failureThreshold": 60
                },
                "readinessProbe": {
                  "tcpSocket": {
                    "port": "https"
                  },
                  "periodSeconds": 5
                },
                "livenessProbe": {
                  "tcpSocket": {
                    "port": "https"
                  },
                  "periodSeconds": 10
                }
              }
            ],
            "volumes": [
              {
                "name": "trust",
                "configMap": {
                  "name": "agentarium-trust"
                }
              },
              {
                "name": "bootstrap",
                "projected": {
                  "sources": [
                    {
                      "serviceAccountToken": {
                        "path": "token",
                        "expirationSeconds": 600,
                        "audience": "agentarium-identity"
                      }
                    }
                  ]
                }
              },
              {
                "name": "bundle-keys",
                "configMap": {
                  "name": "agentarium-bundle-keys"
                }
              },
              {
                "name": "model-profiles",
                "configMap": {
                  "name": "agentarium-model-profiles"
                }
              },
              {
                "name": "epoch",
                "persistentVolumeClaim": {
                  "claimName": "policy-gateway-epoch"
                }
              }
            ],
            "tolerations": [
              {
                "key": "agentarium.io/observe-not-ready",
                "operator": "Equal",
                "value": "true",
                "effect": "NoSchedule"
              }
            ]
          }
        },
        "strategy": {
          "type": "Recreate"
        }
