              "runAsNonRoot": true,
              "runAsUser": 65532,
              "runAsGroup": 65532,
              "fsGroup": 65532,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "terminationGracePeriodSeconds": 30,
            "initContainers": [
              {
                "name": "cloud-sql-proxy",
                "image": "${SQL_PROXY_IMAGE}",
                "restartPolicy": "Always",
                "args": [
                  "--auto-iam-authn",
                  "--private-ip",
                  "--address=127.0.0.1",
                  "--port=5432",
                  "--health-check",
                  "--http-address=0.0.0.0",
                  "--http-port=9801",
                  "--impersonate-service-account=${GATEWAY_DB_GSA}",
                  "${CLOUDSQL_CONNECTION_NAME}"
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/startup",
                    "port": 9801
                  },
                  "periodSeconds": 2,
                  "failureThreshold": 60
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readiness",
                    "port": 9801
                  },
                  "periodSeconds": 5
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/liveness",
                    "port": 9801
                  },
                  "periodSeconds": 10
                }
              }
