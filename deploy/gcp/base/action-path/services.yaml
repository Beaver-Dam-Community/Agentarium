                        "fieldPath": "metadata.name"
                      }
                    }
                  },
                  {
                    "name": "DB_USER",
                    "value": "${GATEWAY_DB_USER}"
                  },
                  {
                    "name": "DB_NAME",
                    "value": "${DB_NAME}"
                  },
                  {
                    "name": "DATABASE_URL",
