# TASK-10 3.2 (bundle ack): control-health reads Deployment status.replicas
# through a client-go informer for the gateway and adapter workloads. An
# informer lists the whole namespace, so resourceNames are not used.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentarium-control-health
  namespace: agent-control
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentarium-control-health
  namespace: agent-control
subjects:
  - kind: ServiceAccount
    name: control-health
    namespace: agent-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentarium-control-health
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentarium-control-health
  namespace: agent-adapters
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentarium-control-health
  namespace: agent-adapters
subjects:
  - kind: ServiceAccount
    name: control-health
    namespace: agent-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentarium-control-health
