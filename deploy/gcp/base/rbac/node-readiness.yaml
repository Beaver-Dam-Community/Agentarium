# TASK-01 3.2.1 (node-readiness): the controller needs nodes get/list/watch/patch
# to remove and re-add the observation start taint. RBAC cannot narrow patch
# to the taint; VAP node-readiness-scope restricts the change. nodes/status is
# not granted. Nodes are cluster-scoped and have no fixed names.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentarium-node-readiness
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentarium-node-readiness
subjects:
  - kind: ServiceAccount
    name: node-readiness
    namespace: agent-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentarium-node-readiness
