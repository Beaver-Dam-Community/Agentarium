# control-health fresh Node reads for NodeFacts (TASK-06 3.2, TASK-10 3.5).
# On a new node/boot's first node-sensors lease, control-health LISTs Nodes to
# find the certified UID (no UID field selector exists), GETs that name to
# re-check the UID, and reads status.nodeInfo.bootID and the pool label.
# get/list only: no watch, nodes/status, patch, taint changes, Pod or Secret.
# Separate from control-health.yaml (#168, Deployment reads) on purpose.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: control-health-nodes
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: control-health-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: control-health-nodes
subjects:
  - kind: ServiceAccount
    name: control-health
    namespace: agent-observe
