# TASK-10 3.7 (node deletion): the correlator detects node deletion with a
# Node informer, so the correlation KSA gets nodes get/list/watch only.
# Nodes are cluster-scoped and have no fixed names.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentarium-correlation
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentarium-correlation
subjects:
  - kind: ServiceAccount
    name: correlation
    namespace: agent-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentarium-correlation
