{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "ServiceAccount",
      "metadata": {
        "name": "credential-broker",
        "namespace": "agent-control"
      },
      "automountServiceAccountToken": false
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "credential-broker",
        "namespace": "agent-control"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "credential-broker"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "credential-broker"
            }
          },
          "spec": {
            "serviceAccountName": "credential-broker",
            "automountServiceAccountToken": false,
            "nodeSelector": {
              "node-restriction.kubernetes.io/agentarium-role": "control"
            },
            "schedulerName": "default-scheduler",
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 65532,
              "runAsGroup": 65532,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "terminationGracePeriodSeconds": 30,
            "initContainers": [
              {
                "name": "cloud-sql-proxy",
                "image": "${SQL_PROXY_IMAGE}",
                "restartPolicy": "Always",
                "args": [
                  "--auto-iam-authn",
                  "--private-ip",
                  "--address=127.0.0.1",
                  "--port=5432",
                  "--health-check",
                  "--http-address=0.0.0.0",
                  "--http-port=9801",
                  "--impersonate-service-account=${BROKER_DB_GSA}",
                  "${CLOUDSQL_CONNECTION_NAME}"
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "50m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "500m",
                    "memory": "256Mi"
                  }
                },
                "startupProbe": {
                  "httpGet": {
                    "path": "/startup",
                    "port": 9801
                  },
                  "periodSeconds": 2,
                  "failureThreshold": 60
                },
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readiness",
                    "port": 9801
                  },
                  "periodSeconds": 5
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/liveness",
                    "port": 9801
                  },
                  "periodSeconds": 10
                }
              }
            ],
            "containers": [
              {
                "name": "credential-broker",
                "image": "${BROKER_IMAGE}",
                "args": [
                  "--identity-url=https://workload-identity.agent-control.svc:8443",
                  "--bootstrap-token=/var/run/agentarium-bootstrap/token",
                  "--tls-ca=/etc/agentarium-trust/ca.pem",
                  "--listen=:8443"
                ],
                "env": [
                  {
                    "name": "DB_USER",
                    "value": "${BROKER_DB_USER}"
                  },
                  {
                    "name": "DB_NAME",
                    "value": "${DB_NAME}"
                  },
                  {
                    "name": "DATABASE_URL",
                    "value": "host=127.0.0.1 port=5432 user=$(DB_USER) dbname=$(DB_NAME) sslmode=disable"
                  }
                ],
                "ports": [
                  {
                    "name": "https",
                    "containerPort": 8443
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "trust",
                    "mountPath": "/etc/agentarium-trust",
                    "readOnly": true
                  },
                  {
                    "name": "bootstrap",
                    "mountPath": "/var/run/agentarium-bootstrap",
                    "readOnly": true
                  }
                ],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "cpu": "1",
                    "memory": "512Mi"
                  }
                },
                "startupProbe": {
                  "tcpSocket": {
                    "port": "https"
                  },
                  "periodSeconds": 2,
                  "failureThreshold": 60
                },
                "readinessProbe": {
                  "tcpSocket": {
                    "port": "https"
                  },
                  "periodSeconds": 5
                },
                "livenessProbe": {
                  "tcpSocket": {
                    "port": "https"
                  },
                  "periodSeconds": 10
                }
              }
            ],
            "volumes": [
              {
                "name": "trust",
                "configMap": {
                  "name": "agentarium-trust"
                }
              },
              {
                "name": "bootstrap",
                "projected": {
                  "sources": [
                    {
                      "serviceAccountToken": {
                        "path": "token",
                        "expirationSeconds": 600,
                        "audience": "agentarium-identity"
                      }
                    }
                  ]
                }
              }
            ],
            "tolerations": [
              {
                "key": "agentarium.io/observe-not-ready",
                "operator": "Equal",
                "value": "true",
                "effect": "NoSchedule"
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "credential-broker",
        "namespace": "agent-control"
      },
      "spec": {
        "selector": {
          "app.kubernetes.io/name": "credential-broker"
        },
        "ports": [
          {
            "name": "https",
            "port": 8443,
            "targetPort": "https"
          }
        ]
      }
    }
  ]
}
