[project]
name = "agentarium-runtime"
version = "0.1.0"
description = "ADK model and tool bridge over the session supervisor IPC"
requires-python = ">=3.12,<3.13"
dependencies = ["google-adk==2.12.0", "jsonschema>=4.26,<5"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentarium_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
