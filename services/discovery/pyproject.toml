[project]
name = "agentarium-discovery"
version = "0.1.0"
description = "TASK-02 call-path discovery service: snapshots, runs, candidates, matcher, promotion"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "uvicorn>=0.32",
    "google-cloud-storage>=2.18",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentarium_discovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real PostgreSQL (DISCOVERY_TEST_DATABASE_URL), cluster or gateway; skipped by default",
]
addopts = "-m 'not integration'"
