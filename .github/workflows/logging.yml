name: logging
on:
  pull_request:
    paths:
      - 'platform/gcp/logging/**'
      - 'platform/gcp/envs/prod/**'
      - '.github/workflows/logging.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform-logging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.7'
      - run: terraform fmt -check -recursive platform/gcp/logging
      - name: Network-policy exclusion (no cloud credentials)
        run: |
          terraform -chdir=platform/gcp/logging init -backend=false -input=false
          terraform -chdir=platform/gcp/logging validate
          terraform -chdir=platform/gcp/logging test
      - name: Production configuration (no backend access)
        run: |
          terraform -chdir=platform/gcp/envs/prod init -backend=false -input=false
          terraform -chdir=platform/gcp/envs/prod validate
