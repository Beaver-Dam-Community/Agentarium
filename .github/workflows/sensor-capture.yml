name: sensor-capture

on:
  pull_request:
    paths:
      - 'sensors/exporter/**'
      - 'deploy/gcp/sensors/**'
      - 'tests/kernel/run-crd-defaults.sh'
      - '.github/workflows/sensor-capture.yml'
  push:
    branches: [main]
    paths:
      - 'sensors/exporter/**'
      - 'deploy/gcp/sensors/**'
      - 'tests/kernel/run-crd-defaults.sh'
      - '.github/workflows/sensor-capture.yml'

permissions:
  contents: read

jobs:
  pinned-crd-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash tests/kernel/run-crd-defaults.sh
