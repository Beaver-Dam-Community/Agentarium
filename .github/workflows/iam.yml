name: iam
on:
  pull_request:
    paths:
      - 'platform/gcp/iam/**'
      - 'platform/gcp/envs/prod/**'
      - '.github/workflows/iam.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  terraform-iam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.7'
      - run: terraform fmt -check -recursive platform/gcp/iam
      - name: Contact IAM mock tests (no cloud credentials)
        run: |
          terraform -chdir=platform/gcp/iam/contact-services init -backend=false -input=false
          terraform -chdir=platform/gcp/iam/contact-services validate
          terraform -chdir=platform/gcp/iam/contact-services test
      - name: Same-environment workload IAM mock tests (no cloud credentials)
        run: |
          terraform -chdir=platform/gcp/iam/workload-services init -backend=false -input=false
          terraform -chdir=platform/gcp/iam/workload-services validate
          terraform -chdir=platform/gcp/iam/workload-services test
      - name: Production module wiring (no backend access)
        run: |
          terraform -chdir=platform/gcp/envs/prod init -backend=false -input=false
          terraform -chdir=platform/gcp/envs/prod validate
          terraform -chdir=platform/gcp/envs/prod test
